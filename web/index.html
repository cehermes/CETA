<!doctype html>
<html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NodeFlow</title>
<style>
:root{--bg:#161616;--card:#353535;--ink:#e8e8e8;--mut:#b4b4b4;--ln:#4a4a4a;--acc:#2dd4bf;--warn:#fbbf24;--bad:#f87171;--pl:#2dd4bf;--ex:#a5b4fc}
*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,"Microsoft YaHei",sans-serif}
#bar{position:fixed;top:36px;left:0;right:0;height:44px;display:flex;gap:8px;align-items:center;padding:0 12px;background:var(--card);border-bottom:1px solid var(--ln);z-index:5}
#bar span{color:var(--mut);margin-left:auto;font-size:12px}
button{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:4px 10px;cursor:pointer}
button:hover,button:focus-visible{border-color:var(--acc);outline:none}button.p{background:var(--acc);color:#fff;border-color:var(--acc)}
#cv{position:absolute;top:80px;inset-inline:0;bottom:0;overflow:hidden;cursor:grab}#cv.pan{cursor:grabbing}.n{cursor:default}#world{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0}#tabs{scrollbar-width:none}#tabs::-webkit-scrollbar{display:none}
#lk{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}#lk path{fill:none;stroke:var(--acc);stroke-width:2;pointer-events:stroke;cursor:pointer}
.n{position:absolute;width:380px;background:var(--card);border:1px solid var(--ln);border-radius:8px}
#lk path.pl{stroke:var(--pl)}#lk path.ex{stroke:var(--ex)}input.r{border-style:dotted;color:var(--mut)}.b>button{margin-top:8px}.b>button+button{margin-left:6px}.n.hit{outline:2px solid var(--acc);outline-offset:2px}
.h{padding:6px 10px;font-weight:600;border-bottom:1px solid var(--ln);cursor:move;display:flex;justify-content:space-between;user-select:none}
.h i{font-style:normal;cursor:pointer;color:var(--mut)}
.b{padding:8px 10px}label{display:flex;justify-content:space-between;align-items:center;gap:6px;color:var(--mut);margin:3px 0}
input{width:100px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:4px;padding:2px 6px;text-align:right}input.a{border-style:dashed}
pre{margin:8px 0 0;padding-top:8px;border-top:1px solid var(--ln);white-space:pre-wrap;font:inherit}.w{color:var(--warn)}.e{color:var(--bad)}
.pt{position:absolute;top:50%;margin-top:-7px;width:14px;height:14px;border-radius:50%;background:var(--card);border:2px solid var(--acc);cursor:crosshair}.pt.on{background:var(--acc)}
.in{left:-17px}.out{right:-17px}.row{position:relative}.row.hit{outline:2px solid var(--acc);border-radius:4px}.val{min-width:100px;text-align:right;color:var(--ink);padding:2px 6px;border:1px dotted var(--ln);border-radius:4px}pre:empty{display:none}canvas{width:100%;border:1px solid var(--ln);border-radius:4px;margin-top:6px}
#t{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:6px 14px;border-radius:6px;display:none;z-index:9}
#tabs{position:fixed;top:0;left:0;right:0;height:36px;display:flex;background:var(--bg);border-bottom:1px solid var(--ln);z-index:6;overflow-x:auto}
.tab{display:flex;align-items:center;gap:10px;padding:0 14px;min-width:120px;max-width:220px;color:var(--mut);border-right:1px solid var(--ln);cursor:pointer;white-space:nowrap}
.tab span{overflow:hidden;text-overflow:ellipsis;flex:1}.tab.on{background:var(--card);color:var(--ink);box-shadow:inset 0 -2px var(--acc)}
.tab b{font-weight:400;width:16px;text-align:center}.tab b.d{font-size:0}.tab b.d::after{content:'●';font-size:13px}.tab b.d:hover::after{content:'×';font-size:16px}.tab b:hover{color:var(--bad)}
.tab.add{min-width:40px;justify-content:center;font-size:18px}
#empty{position:absolute;left:30px;top:30px;color:var(--mut);display:none}
html{color-scheme:dark}
#cv{background-color:#161616;background-image:linear-gradient(#262626 1px,transparent 1px),linear-gradient(90deg,#262626 1px,transparent 1px),linear-gradient(#1d1d1d 1px,transparent 1px),linear-gradient(90deg,#1d1d1d 1px,transparent 1px);background-size:100px 100px,100px 100px,20px 20px,20px 20px}
#tabs{background:#171717;border-color:#333}.tab{color:#9a9a9a;border-color:#333}.tab.on{background:#171717;color:#fff;box-shadow:inset 0 -2px #fff}
#bar{background:#202020;border-color:#333}
button{background:#2c2c2c;color:var(--ink);border-color:#464646}button.p{background:var(--acc);color:#052b26;border-color:var(--acc);font-weight:600}
.n{background:var(--card);border:1px solid #2a2a2a;border-radius:12px;box-shadow:0 4px 14px #0009}
.h{background:#2d2d2d;border-radius:12px 12px 0 0;border-bottom:1px solid #262626;color:#bdbdbd}
.h .dot::after{content:'';position:absolute;left:-10px;right:-8px;top:-12px;bottom:-12px}.h .dot{position:relative;display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:10px;vertical-align:-1px;background:var(--dot,#777);cursor:pointer}.h .dot:hover{box-shadow:0 0 0 3px #ffffff33}
.n.pl{--dot:var(--pl)}.n.ex{--dot:var(--ex)}
.row input,.val{width:104px;border:0;border-radius:999px;padding:3px 12px;text-align:right;font:inherit;background:#f1f1f1;color:#151515}
.row input.a,.row input:read-only,.val{background:#4a4a4a;color:#c8c8c8}.row input::placeholder{color:#9a9a9a}
.pt{width:14px;height:14px;border:2px solid #1d1d1d;background:#6be26b}.pt.s,.pt.s.on{background:#f5c542}.pt.on{background:#6be26b}
.pt.rec,.pt.rec.on{background:#4aa3ff}
#lk path{stroke-width:2.5}#lk path.tn{stroke:#8db48d}#lk path.ts{stroke:#c6b560}#lk circle.tn{fill:#8db48d}#lk circle.ts{fill:#c6b560}
.n.t-open,.n.t-be,.n.t-exit,.n.t-addp{--dot:#fff}
.pt.out.ro,.pt.out.ro.on,.pt.s.out.ro{background:#8a8a8a}
.anc{display:none;position:absolute;top:50%;margin-top:-7px;width:14px;height:14px;border-radius:50%;background:#6f9f6f;border:2px solid #1d1d1d}.anc.l{left:-8px}.anc.r{right:-8px}
.n.col{width:auto}.n.col .b{display:none}.n.col .h{border-bottom:0;border-radius:12px;padding:8px 20px;white-space:nowrap}.n.col .h i{display:none}.n.col .anc{display:block}
#lk path.hit{fill:none;stroke:transparent;stroke-linecap:round}#lk g:hover path:not(.hit){stroke-width:4.5}#lk g:hover circle{r:7px}
</style>

 try{const buf=await f.arrayBuffer(),u=new Uint8Array(buf);if(u[0]==123||(u[0]==239&&u[3]==123))isJ=true;
  let txt;if(isJ){txt=new TextDecoder().decode(buf).replace(/^\uFEFF/,'');if(!Array.isArray(JSON.parse(txt).nodes))throw 0}else txt=readTxt(buf).workflow;
  if(!txt)throw 0;const g=fromData(JSON.parse(txt));g.dirty=false;W.push(g);sw(g);toast('已在新标签中还原工作流')}catch{toast(isJ?'这个json文件里没有有效的工作流':'这张图片里没有工作流信息')}};
document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const r=cv.getBoundingClientRect(),o=(G.nodes.length%6)*28;add(b.dataset.a,(r.width/2-V.x)/V.z-190+o,(r.height/2-V.y)/V.z-150+o,{});upd();touch()});
$('#fold').onclick=()=>fetch('/api/open',{method:'POST'}).catch(()=>toast('需通过 start.bat 启动'));
async function boot(){let st=null;
 if(location.protocol!='file:')try{const r=await fetch('/api/state');if(r.ok){const t=await r.json();if(t&&t.w&&t.w.length)st=t}}catch{}
 if(!st)try{st=JSON.parse(localStorage.getItem('nf2')||'null')}catch{}
 try{if(st&&st.w&&st.w.length){W=st.w.map(fromData);setG(W[Math.min(st.cur||0,W.length-1)])}}catch{W=[];G=null}
 if(!G){setG(defWf(true));W=[G]}
 G.nodes.forEach(n=>world.append(n.el));track=false;upd();track=true;renderTabs();persist()}
boot();
